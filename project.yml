# XcodeGen 配置 —— 在 macOS 上一条命令生成可打开的 Xcode 工程
#
# 用法（需先装 XcodeGen：brew install xcodegen）：
#   cd 奶茶优惠雷达-iOS
#   xcodegen generate
#   open MilkTeaRadar.xcodeproj
#
# 若不想装 XcodeGen，也可在 Xcode 里手动新建 App 工程后把 MilkTeaRadar/ 拖进去，
# 详见《构建说明.md》。

name: MilkTeaRadar

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  MilkTeaRadar:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MilkTeaRadar
        excludes:
          - "Resources/Info.plist"     # 由下方 info 配置统一生成，避免重复
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.milktearadar
        PRODUCT_NAME: 奶茶优惠雷达
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"              # 仅 iPhone
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        # ---- 服务端地址：改这里即可切换环境 ----
        API_BASE_URL: "https://api.example.com/v1"
        REALTIME_URL: "https://api.example.com/v1/deals/stream"
        # ---- 代码签名（真机调试时填自己的 Team ID）----
        # DEVELOPMENT_TEAM: XXXXXXXXXX
        CODE_SIGN_STYLE: Automatic
    info:
      path: MilkTeaRadar/Resources/Info.plist
      properties:
        CFBundleDisplayName: 奶茶优惠雷达
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSUserNotificationUsageDescription: 用于在优惠活动截止当天提醒你，避免错过优惠
        UIBackgroundModes:
          - fetch
          - remote-notification
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        API_BASE_URL: "$(API_BASE_URL)"
        REALTIME_URL: "$(REALTIME_URL)"

schemes:
  MilkTeaRadar:
    build:
      targets:
        MilkTeaRadar: all
    run:
      config: Debug
